<script>
const e=document.getElementById('e'),l=document.getElementById('l'),t=document.getElementById('t'),k=document.getElementById('k'),w=document.getElementById('w'),n=document.getElementById('n');
let d={r:[]},f=null,pId=null;
for(let i=20; i<=40; i++)l.innerHTML+=`<option value="${i}">${i}字</option>`;l.value="30";
window.onload=()=>{
    try{document.execCommand('defaultParagraphSeparator', false, 'div');}catch(err){}
    let s=localStorage.getItem('n_d'),sw=localStorage.getItem('n_w'),sc=localStorage.getItem('n_c');
    if(s){try{d=JSON.parse(s)}catch(err){}}
    if(!d||!d.r||d.r.length===0){
        let id='d_'+Date.now();
        d={r:[{id,type:'file',name:'第1話',content:'<div><br></div>'}]};
        f=id;
    }else{
        if(sc&&g(sc)){
            f=sc;
        }else{
            function findFirst(items){
                for(let it of items){
                    if(it.type==='file')return it.id;
                    if(it.children){let res=findFirst(it.children);if(res)return res;}
                }
                return null;
            }
            f=findFirst(d.r)||d.r[0].id;
        }
    }
    function cleanAllStoriesInStorage(){
        if(!d||!d.r)return;
        function walkItems(items){
            items.forEach(it=>{
                let changed=false;
                if(it.content){
                    let tmp=document.createElement('div');
                    tmp.innerHTML=it.content;
                    if(it.content.includes('sp-nonzen')){
                        let badSpans=tmp.querySelectorAll('.sp-nonzen');
                        badSpans.forEach(sp=>{
                            let txt=sp.textContent||'';
                            if(/[^\s\u00A0]/.test(txt)||txt===''||txt==='\n'){
                                changed=true;
                                let p=sp.parentNode;
                                if(p){
                                    if(txt===''||txt==='\n'){
                                        while(sp.firstChild)p.insertBefore(sp.firstChild,sp);
                                        p.removeChild(sp);
                                    }else{
                                        p.replaceChild(document.createTextNode(txt),sp);
                                    }
                                }
                            }
                        });
                    }
                    // 先頭に溜まった2行以上の不要な空白行（長文貼り付け時の空行問題）を解消
                    let divs=tmp.querySelectorAll('div');
                    let firstContentIdx=-1;
                    for(let i=0;i<divs.length;i++){
                        let t=divs[i].textContent.replace(/[\s\u3000\r\n]/g,'');
                        if(t.length>0||divs[i].querySelector('.sub-sup, .hidden-char-badge, .hm-mark, img')){
                            firstContentIdx=i;
                            break;
                        }
                    }
                    if(firstContentIdx>=2){
                        for(let i=0;i<firstContentIdx;i++) divs[i].remove();
                        changed=true;
                    }
                    if(changed) it.content=tmp.innerHTML;
                }
                if(it.children)walkItems(it.children);
            });
        }
        walkItems(d.r);
        localStorage.setItem('n_d',JSON.stringify(d));
    }
    cleanAllStoriesInStorage();
    if(sw)l.value=sw;

    }

};
function cleanExcessiveLeadingLines(root = e){
    let divs = root.querySelectorAll('#e>div');
    if(divs.length === 0) divs = root.querySelectorAll('div');
    if(divs.length <= 1) return;
    let firstContentIdx = -1;
    for(let i = 0; i < divs.length; i++){
        let t = divs[i].textContent.replace(/[\s\u3000\r\n]/g, '');
        if(t.length > 0 || divs[i].querySelector('.sub-sup, .hidden-char-badge, .hm-mark, img')){
            firstContentIdx = i;
            break;
        }
    }
    if(firstContentIdx >= 2){
        for(let i = 0; i < firstContentIdx; i++){
            divs[i].remove();
        }
    }
}
function cleanExcessiveTrailingLines(root = e){
    let divs = root.querySelectorAll('#e>div');
    if(divs.length === 0) divs = root.querySelectorAll('div');
    if(divs.length <= 2) return;
    let lastContentIdx = -1;
    for(let i = divs.length - 1; i >= 0; i--){
        let t = divs[i].textContent.replace(/[\s\u3000\r\n]/g, '');
        if(t.length > 0 || divs[i].querySelector('.sub-sup, .hidden-char-badge, .hm-mark, img')){
            lastContentIdx = i;
            break;
        }
    }
    if(lastContentIdx !== -1 && (divs.length - 1 - lastContentIdx) > 2){
        for(let i = divs.length - 1; i > lastContentIdx + 2; i--){
            divs[i].remove();
        }
    }
}
function cleanExcessiveBlankLines(root = e){
    cleanExcessiveLeadingLines(root);
    cleanExcessiveTrailingLines(root);
}
function cleanContaminatedSpans(){
    let nonzens = e.querySelectorAll('.sp-nonzen');
    if(nonzens.length === 0) return;
    let sel = window.getSelection();
    let curContainer = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0).startContainer : null;
    let curOffset = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0).startOffset : 0;
    
    nonzens.forEach(sp => {
        let txt = sp.textContent || '';
        let hasNonSpace = /[^\s\u00A0]/.test(txt);
        let isEmpty = (txt === '' || txt === '\n');
        if(!hasNonSpace && !isEmpty) return;
        
        let isCursorInside = curContainer && sp.contains(curContainer);
        let p = sp.parentNode;
        if(!p) return;
        
        if(isEmpty){
            while(sp.firstChild){
                p.insertBefore(sp.firstChild, sp);
            }
            p.removeChild(sp);
        } else {
            let tn = document.createTextNode(txt);
            p.replaceChild(tn, sp);
            if(isCursorInside){
                try{
                    let newRange = document.createRange();
                    let safeOffset = Math.min(curOffset, txt.length);
                    newRange.setStart(tn, safeOffset);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                }catch(err){}
            }
        }
    });
}

function cleanSpans(){
    let charBoxes=e.querySelectorAll('.char-box');
    charBoxes.forEach(s=>{
        let p=s.parentNode;
        while(s.firstChild)p.insertBefore(s.firstChild,s);
        p.removeChild(s);
    });
    cleanContaminatedSpans();
    let spans=e.querySelectorAll('span:not(.sub-sup):not(.hidden-char-badge):not(.hm-mark):not(.er):not(.sp-nonzen)');
    spans.forEach(s=>{
        let p=s.parentNode;
        while(s.firstChild)p.insertBefore(s.firstChild,s);
        p.removeChild(s);
    });
}
const regSpecialChars=/[\u2070-\u209F\u00B2\u00B3\u00B9\u2150-\u215E\u00BC-\u00BE∓±×÷√∞]/;
const regCombinedFilter=/([\u2070-\u209F\u00B2\u00B3\u00B9\u2150-\u215E\u00BC-\u00BE∓±×÷√∞])/g;

function autoFormatEditor(optActiveLine, optActiveOffset){
    let activeLine=optActiveLine;
    let activeOffset=optActiveOffset;
    
    if(activeLine===undefined){
        let sel=window.getSelection();
        if(sel&&sel.rangeCount>0){
            let r=sel.getRangeAt(0);
            let n=r.startContainer;
            while(n&&n!==e&&n.parentElement!==e){
                n=n.parentElement;
            }
            if(n&&n.parentElement===e){
                activeLine=n;
                let preRange=r.cloneRange();
                preRange.selectNodeContents(activeLine);
                preRange.setEnd(r.startContainer,r.startOffset);
                activeOffset=preRange.toString().length;
            }
        }
    }
    
    let walker=document.createTreeWalker(e,NodeFilter.SHOW_TEXT,null,false);
    let nodes=[];
    while(walker.nextNode()){
        let p=walker.currentNode.parentNode;
        if(p&&(p.classList.contains('sub-sup')||p.classList.contains('hidden-char-badge')))continue;
        nodes.push(walker.currentNode);
    }
    
    let changed=false;
    for(let tn of nodes){
        let val=tn.nodeValue;
        if(regSpecialChars.test(val)){
            changed=true;
            let frag=document.createDocumentFragment();
            let parts=val.split(regCombinedFilter);
            for(let part of parts){
                if(!part)continue;
                if(regSpecialChars.test(part)){
                    let sp=document.createElement('span');
                    sp.className='sub-sup';
                    sp.setAttribute('contenteditable','false');
                    sp.textContent=part;
                    frag.appendChild(sp);
                }else{
                    frag.appendChild(document.createTextNode(part));
                }
            }
            tn.parentNode.replaceChild(frag,tn);
        }
    }
    if(changed && activeLine&&activeOffset!==null&&activeOffset!==undefined){
        setCaretCharOffset(activeLine,activeOffset);
    }
}

function setCaretCharOffset(lineEl,targetOffset){
    let sel=window.getSelection();
    if(!sel)return;
    let walker=document.createTreeWalker(lineEl,NodeFilter.SHOW_TEXT,null,false);
    let count=0;
    let lastNode=null;
    let set=false;
    while(walker.nextNode()){
        let node=walker.currentNode;
        lastNode=node;
        let len=node.nodeValue.length;
        if(count+len>=targetOffset){
            let range=document.createRange();
            let offsetInNode=Math.min(targetOffset-count,len);
            let p=node.parentElement;
            let isSpecialElem = p && (p.getAttribute('contenteditable')==='false' || p.classList.contains('sp-nonzen') || p.classList.contains('sub-sup') || p.classList.contains('hm-mark') || p.classList.contains('hidden-char-badge'));
            if(isSpecialElem){
                if(offsetInNode>=len){
                    range.setStartAfter(p);
                }else{
                    range.setStartBefore(p);
                }
            }else{
                range.setStart(node,offsetInNode);
            }
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
            set=true;
            break;
        }
        count+=len;
    }
    if(!set){
        let range=document.createRange();
        if(lastNode){
            let p=lastNode.parentElement;
            let isSpecialElem = p && (p.getAttribute('contenteditable')==='false' || p.classList.contains('sp-nonzen') || p.classList.contains('sub-sup') || p.classList.contains('hm-mark') || p.classList.contains('hidden-char-badge'));
            if(isSpecialElem){
                range.setStartAfter(p);
            }else{
                range.setStart(lastNode,lastNode.nodeValue.length);
            }
        }else{
            let br=lineEl.querySelector('br');
            if(br){
                range.setStartBefore(br);
            }else{
                range.selectNodeContents(lineEl);
            }
        }
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
    }
}

// 全角スペース以外のスペース（半角スペースやタブ等）に背景色を付ける
// 「␣」等の記号は絶対に使わず、元のスペース文字そのままで表示
function highlightSpaces(optActiveLine, optActiveOffset){
    // 既存の .sp-nonzen を検査し、空白以外の文字や空spanを即座に安全解除（黄色文字化の根本防止）
    cleanContaminatedSpans();

    if (document.body.classList.contains('sp-color-off')) return;

    let activeLine=optActiveLine;
    let activeOffset=optActiveOffset;
    if(activeLine===undefined){
        let sel=window.getSelection();
        if(sel&&sel.rangeCount>0){
            let r=sel.getRangeAt(0);
            let n=r.startContainer;
            while(n&&n!==e&&n.parentElement!==e){
                n=n.parentElement;
            }
            if(n&&n.parentElement===e){
                activeLine=n;
                let pre=r.cloneRange();
                pre.selectNodeContents(activeLine);
                pre.setEnd(r.startContainer,r.startOffset);
                activeOffset=pre.toString().length;
            }
        }
    }
    
    let walker=document.createTreeWalker(e,NodeFilter.SHOW_TEXT,null,false);
    let nodes=[];
    while(walker.nextNode()){
        let p=walker.currentNode.parentNode;
        if(p&&(p.classList.contains('sp-nonzen')||p.classList.contains('sub-sup')||p.classList.contains('hidden-char-badge')||p.classList.contains('hm-mark')||p.classList.contains('er')))continue;
        nodes.push(walker.currentNode);
    }
    
    const regSpace=/([^\S\u3000\r\n]+)/g;
    let changed=false;
    for(let tn of nodes){
        let val=tn.nodeValue;
        if(/[^\S\u3000\r\n]/.test(val)){
            changed=true;
            let frag=document.createDocumentFragment();
            let parts=val.split(regSpace);
            for(let part of parts){
                if(!part)continue;
                if(/[^\S\u3000\r\n]/.test(part)){
                    let sp=document.createElement('span');
                    sp.className='sp-nonzen';
                    // ␣は使わず元の空白文字そのまま
                    sp.textContent=part;
                    frag.appendChild(sp);
                }else{
                    frag.appendChild(document.createTextNode(part));
                }
            }
            tn.parentNode.replaceChild(frag,tn);
        }
    }
    if(changed && activeLine&&activeOffset!==null&&activeOffset!==undefined){
        setCaretCharOffset(activeLine,activeOffset);
    }
}

function countCharsFromLines(lines){
    let totalChars=0;
    let withoutSpaces=0;
    let lastContentIdx = -1;
    for(let i=0; i<lines.length; i++){
        let line = lines[i];
        totalChars += line.length;
        let noSpace = line.replace(/[\s\u3000]/g,'');
        withoutSpaces += noSpace.length;
        if(noSpace.length > 0){
            lastContentIdx = i;
        }
    }
    return {
        totalChars,
        withoutSpaces,
        lines: Math.max(1, lastContentIdx + 1)
    };
}

function findItemContext(id, list=d.r, parentFolder=null){
    for(let idx=0; idx<list.length; idx++){
        let item=list[idx];

        if(item.children){

}

function isDescendantOrSelf(folderItem, checkId){
    if(!folderItem) return false;
    if(folderItem.id===checkId) return true;
    if(!folderItem.children) return false;
    for(let ch of folderItem.children){
        if(ch.type==='folder'&&isDescendantOrSelf(ch, checkId)) return true;
    }
    return false;
}

function getFolderStats(folderItem){

        if(it.type==='file'){

            chars+=st.chars;

        }else if(it.children){

            it.children.forEach(walk);

    if(folderItem.children) folderItem.children.forEach(walk);
    return { files, chars, withoutSpaces, subfolders };
}

function reorderTreeItem(sourceId, targetId, position){
    if(!sourceId) return;
    if(position !== 'root-end' && (!targetId || sourceId === targetId)) return;
    
    let sourceCtx = findItemContext(sourceId);
    if(!sourceCtx) return;
    
    // フォルダ自身または自身の子孫階層への移動を防止
    if(sourceCtx.item.type === 'folder' && targetId && isDescendantOrSelf(sourceCtx.item, targetId)){
        return;
    }
    
    let itemToMove = sourceCtx.item;
    
    if(position === 'root-end'){
        // 最上層（ルート）の末尾へ移動
        sourceCtx.list.splice(sourceCtx.index, 1);
        d.r.push(itemToMove);
    } else if(position === 'inside'){
        // フォルダ内部へ移動
        let targetItem = g(targetId);
        if(!targetItem || targetItem.type !== 'folder') return;
        sourceCtx.list.splice(sourceCtx.index, 1);
        if(!targetItem.children) targetItem.children = [];
        targetItem.children.push(itemToMove);
        collapsedFolders.delete(targetItem.id);
    } else {
        // 前または後ろへの並び替え
        let targetCtx = findItemContext(targetId);
        if(!targetCtx) return;
        
        sourceCtx.list.splice(sourceCtx.index, 1);
        
        let targetIdx = targetCtx.list.indexOf(targetCtx.item);
        if(targetIdx === -1){
            targetCtx.list.push(itemToMove);
        } else {
            let insertIdx = (position === 'after') ? targetIdx + 1 : targetIdx;
            targetCtx.list.splice(insertIdx, 0, itemToMove);
        }
    }
    
    s();
    r();
    v();
    
    if(typeof navigator !== 'undefined' && navigator.vibrate){
        try{ navigator.vibrate(15); }catch(e){}
    }
}

    };
    t.ondrop = (ev) => {
        let targetRow = ev.target.closest('.tree-row');
        if(!targetRow && currentTreeDropAction){
            ev.preventDefault();
            let srcId = ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : (treeActiveDrag && treeActiveDrag.id);
            if(srcId){
                reorderTreeItem(srcId, null, 'root-end');
            }
            clearTreeDropIndicators();
            treeActiveDrag = null;
            currentTreeDropAction = null;
        }
    };
    
    window.addEventListener('touchmove', (ev)=>{
        if(!treeActiveDrag || !treeActiveDrag.isDragging) return;
        let touch = ev.touches && ev.touches[0];
        if(!touch) return;
        
        ev.preventDefault();
        
        let ghost = getOrCreateDragGhost();
        ghost.style.left = (touch.clientX + 10) + 'px';
        ghost.style.top = (touch.clientY - 24) + 'px';
        
        let tRect = t.getBoundingClientRect();
        if(touch.clientY < tRect.top + 40){
            t.scrollTop -= 8;
        }else if(touch.clientY > tRect.bottom - 40){
            t.scrollTop += 8;
        }
        
        clearTreeDropIndicators();
        currentTreeDropAction = null;
        
        let pointEl = document.elementFromPoint(touch.clientX, touch.clientY);
        let targetRow = pointEl ? pointEl.closest('.tree-row') : null;
        
        if(!targetRow && pointEl && pointEl.closest('#t')){
            let rows = Array.from(t.querySelectorAll('.tree-row'));
            for(let rEl of rows){
                let rect = rEl.getBoundingClientRect();
                if(touch.clientY >= rect.top && touch.clientY <= rect.bottom){
                    targetRow = rEl;
                    break;
                }
            }
        }
        
        if(targetRow){
            let targetId = targetRow.dataset.id;
            if(targetId === treeActiveDrag.id) return;
            
            let targetCtx = findItemContext(targetId);
            if(!targetCtx) return;
            
            if(treeActiveDrag.item.type === 'folder' && isDescendantOrSelf(treeActiveDrag.item, targetId)){
                return;
            }
            
            let rect = targetRow.getBoundingClientRect();
            let relY = touch.clientY - rect.top;
            let ratio = relY / rect.height;
            
            if(targetCtx.item.type === 'folder' && ratio > 0.25 && ratio < 0.75){
                targetRow.classList.add('tree-drop-inside');
                currentTreeDropAction = { targetId, position: 'inside' };
            }else if(ratio <= 0.5){
                targetRow.classList.add('tree-drop-top');
                currentTreeDropAction = { targetId, position: 'before' };
            }else{
                targetRow.classList.add('tree-drop-bottom');
                currentTreeDropAction = { targetId, position: 'after' };
            }
        }else if(pointEl && pointEl.closest('#t')){
            let tEnd = document.getElementById('treeDropEndIndicator');
            if(tEnd) tEnd.style.display = 'block';
            currentTreeDropAction = { targetId: null, position: 'root-end' };
        }
    }, {passive: false});
    
    window.addEventListener('touchend', ()=>{
        if(!treeActiveDrag) return;
        let ghost = document.getElementById('treeDragGhost');
        if(ghost) ghost.style.display = 'none';
        
        if(treeActiveDrag.rowEl){
            treeActiveDrag.rowEl.classList.remove('tree-row-dragging');
        }
        
        clearTreeDropIndicators();
        
        if(currentTreeDropAction && treeActiveDrag.id){
            reorderTreeItem(treeActiveDrag.id, currentTreeDropAction.targetId, currentTreeDropAction.position);
        }
        
        treeActiveDrag = null;
        currentTreeDropAction = null;
    }, {passive: true});
    
    window.addEventListener('touchcancel', ()=>{
        if(!treeActiveDrag) return;
        let ghost = document.getElementById('treeDragGhost');
        if(ghost) ghost.style.display = 'none';
        if(treeActiveDrag.rowEl) treeActiveDrag.rowEl.classList.remove('tree-row-dragging');
        clearTreeDropIndicators();
        treeActiveDrag = null;
        currentTreeDropAction = null;
    }, {passive: true});
}

    row.ondrop = (ev) => {

function countTotalFiles(items){
    let count=0;
    function walk(list){
        for(let it of list){
            if(it.type==='file')count++;
            if(it.children)walk(it.children);
        }
    }
    if(items)walk(items);
    return count;
}

function execFolderBatchReplace(){
    if(!currentModalItemId) return;
    let ctx=findItemContext(currentModalItemId);
    if(!ctx||ctx.item.type!=='folder') return;
    
    let fInput=document.getElementById('modalFolderRepFrom');
    let tInput=document.getElementById('modalFolderRepTo');
    let msgEl=document.getElementById('modalFolderRepMsg');
    
    let fVal=fInput?fInput.value:'';
    let tVal=tInput?tInput.value:'';
    
    if(!fVal){
        if(msgEl){
            msgEl.textContent='検索文字列を入力してください。';
            msgEl.style.color='#dc2626';
        }
        return;
    }
    
    // 現在編集中（開いている話）の最新状態を同期
    s();
    
    let escaped=fVal.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    let regex=new RegExp(escaped, 'g');
    
    let totalReplacedCount=0;
    let changedFilesCount=0;
    
    function replaceInHTML(html){
        let wrapper=document.createElement('div');
        wrapper.innerHTML=html||'';
        let divs=wrapper.querySelectorAll('div');
        let fileRepCount=0;
        
        if(divs.length>0){
            divs.forEach(d=>{
                let txt=d.innerText;
                if(regex.test(txt)){
                    let matches=txt.match(regex);
                    if(matches) fileRepCount+=matches.length;
                    let newText=txt.replace(regex, tVal);
                    d.innerHTML=newText?newText:'<br>';
                }
            });
        }else{
            let txt=wrapper.innerText;
            if(regex.test(txt)){
                let matches=txt.match(regex);
                if(matches) fileRepCount+=matches.length;
                let newText=txt.replace(regex, tVal);
                wrapper.innerHTML=newText?`<div>${newText}</div>`:'<div><br></div>';
            }
        }
        return {
            newHtml: wrapper.innerHTML,
            count: fileRepCount
        };
    }
    
    function processFolderItems(items){
        items.forEach(it=>{
            if(it.type==='file'){
                let rawContent=(it.id===f)?e.innerHTML:(it.content||'<div><br></div>');
                let res=replaceInHTML(rawContent);
                if(res.count>0){
                    totalReplacedCount+=res.count;
                    changedFilesCount++;
                    it.content=res.newHtml;
                    if(it.id===f){
                        e.innerHTML=res.newHtml;
                    }
                }
            }else if(it.children){
                processFolderItems(it.children);
            }
        });
    }
    
    if(ctx.item.children){
        processFolderItems(ctx.item.children);
    }
    
    if(totalReplacedCount>0){
        s();
        r();
        v();
        updateModalContent(currentModalItemId);
        if(msgEl){
            msgEl.textContent=`${changedFilesCount}話中、計${totalReplacedCount}箇所を置換しました！`;
            msgEl.style.color='#16a34a';
        }
    }else{
        if(msgEl){
            msgEl.textContent='該当する文字列は見つかりませんでした。';
            msgEl.style.color='#64748b';
        }
    }
}

function doRep(isAll){
    const fVal=document.getElementById('rFrom').value;
    const tVal=document.getElementById('rTo').value;

    if(!fVal){
        msg.textContent='検索文字を入力してください';
        return;
    }
    norm();

    if(divs.length===0){
        e.innerHTML='<div>'+e.innerHTML+'</div>';
        divs=e.querySelectorAll('#e>div');
    }
    let count=0;
    const escaped=fVal.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex=new RegExp(escaped, isAll?'g':'');
    
    for(let d of divs){
        let txt=d.innerText;
        if(regex.test(txt)){
            let matches=txt.match(regex);
            if(matches) count+=matches.length;
            let newText=txt.replace(regex, tVal);
            d.innerHTML=newText?newText:'<br>';
            if(!isAll && count>0) break;
        }
    }
    
    if(count>0){
        msg.textContent=`${count}件置換しました`;
        v();
        s();
    }else{
        msg.textContent='見つかりませんでした';
    }
}

function fx(){

    let divs=e.querySelectorAll('#e>div');if(divs.length===0){e.innerHTML='<div>'+e.innerHTML+'</div>';divs=e.querySelectorAll('#e>div')}
    divs.forEach(d=>{

        clone.querySelectorAll('.sp-nonzen').forEach(s=>s.replaceWith(s.textContent||' '));
        clone.querySelectorAll('.char-box').forEach(s=>{

        });

        });

                // 半角の英字・数字・記号を日本の原稿用紙の標準である全角（1マス1文字）に自動変換
                h+=String.fromCharCode(c.charCodeAt(0)+0xFEE0);

                h+=`<span class="er">言</span><span class="er">頭</span>`;

                h+=c;

}

/* テキスト抽出・.txtファイル保存処理 */
function getStoryPlainText(contentHtml){
    let wrapper=document.createElement('div');
    wrapper.innerHTML=contentHtml||'';
    let divs=wrapper.querySelectorAll('div');
    let lines=[];
    if(divs.length>0){
        divs.forEach(d=>{
            let clone=d.cloneNode(true);
            clone.querySelectorAll('.hidden-char-badge').forEach(b=>b.remove());
            clone.querySelectorAll('.sp-nonzen').forEach(s=>s.replaceWith(s.textContent||' '));
            clone.querySelectorAll('.sp').forEach(s=>s.replaceWith(' '));
            let t=clone.innerText.replace(/\r?\n/g,'');
            lines.push(t);
        });
    }else{
        let clone=wrapper.cloneNode(true);
        clone.querySelectorAll('.hidden-char-badge').forEach(b=>b.remove());
        clone.querySelectorAll('.sp-nonzen').forEach(s=>s.replaceWith(s.textContent||' '));
        clone.querySelectorAll('.sp').forEach(s=>s.replaceWith(' '));
        lines=(clone.innerText||'').split(/\r?\n/);
    }
    while(lines.length>1 && lines[lines.length-1].replace(/[\s\u3000]/g,'')===''){
        lines.pop();
    }
    return lines.join('\n');
}

function downloadTextFile(filename, text){
    let blob=new Blob([text],{type:'text/plain;charset=utf-8'});
    let url=URL.createObjectURL(blob);
    let a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000);
}

            folder.children.forEach(ch=>{

                    allTexts.push(`【${ch.name}】\n\n`+cText);

                }
            });
        }
        walkFolder(it);
        let safeName=(it.name||'フォルダ').replace(/[\\/:*?"<>|]/g,'_');
        downloadTextFile(safeName+'.txt', allTexts.join('\n\n\n--------------------\n\n\n'));
    }
}

let isComposing=false;
let heavyTaskTimer=null;
let pendingCleanLines=false;

// 文字のマス入れ（空白ハイライト・添字1マス化・スパンクリーン）、文字数カウント、保存を一括実行
function runHeavyTask(){
    if(isComposing) return;
    if(pendingCleanLines){
        cleanExcessiveLeadingLines();
        pendingCleanLines=false;
    }
    cleanContaminatedSpans();
    highlightSpaces();
    autoFormatEditor();
    v();
    s();
    try{
        localStorage.setItem('n_r',e.innerHTML);
    }catch(err){}
}

// 確定保存が必要なタイミング（タブ切り替え・保存・コピー・離脱等）で即時実行
function flushPendingHeavyTask(){
    if(heavyTaskTimer){
        clearTimeout(heavyTaskTimer);
        heavyTaskTimer=null;
        runHeavyTask();
    }
}

// 遅延実行デバウンス制御
// 通常入力時：0.3秒後（300ms）
// 長文貼り付け時：1秒後（1000ms）
function scheduleHeavyTask(delay=300, needCleanLines=false){
    if(isComposing) return;
    if(needCleanLines) pendingCleanLines=true;
    clearTimeout(heavyTaskTimer);
    heavyTaskTimer=setTimeout(()=>{
        heavyTaskTimer=null;
        runHeavyTask();
    }, delay);
}

// 既存コード互換エイリアス
function scheduleFormat(delay=300){
    scheduleHeavyTask(delay);
}

e.addEventListener('compositionend',()=>{

    scheduleHeavyTask(300);

// 半角スペース等の直後・内部でEnter改行した際、
// ブラウザが新しい行に .sp-nonzen を複製して後続の文字まで黄色くしてしまう問題を完全に遮断する
e.addEventListener('keydown', (ev)=>{
    if(ev.key === 'Enter'){
        if(isComposing) return;
        
        let sel = window.getSelection();
        if(sel && sel.rangeCount > 0){
            let r = sel.getRangeAt(0);
            let n = r.startContainer;
            let sp = (n.nodeType === 1) ? n.closest('.sp-nonzen') : n.parentElement?.closest('.sp-nonzen');
            if(sp){
                let range = document.createRange();
                range.setStartAfter(sp);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }
        
        // 改行時も即座の重い同期処理は走らせず、0.3秒後にマス入れ・文字数カウントを実行
        scheduleHeavyTask(300);
    }
});

e.addEventListener('paste', (ev)=>{
    ev.preventDefault();
    let text = (ev.clipboardData || window.clipboardData)?.getData('text/plain') || '';
    if(!text) return;
    
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    
    // 現在のエディタが実質空（空白のみ、または初期の空行のみ）か確認
    let currentPure = getEditorPureTextFromElement(e).join('').trim();
    let isDocEmpty = (currentPure.length === 0);
    
    if(isDocEmpty){
        // 先頭の不要な連続改行をトリムして1行目から綺麗に配置
        text = text.replace(/^\n+/, '');
        let lines = text.split('\n');
        let frag = document.createDocumentFragment();
        lines.forEach(lineText => {
            let d = document.createElement('div');
            if(lineText){
                d.textContent = lineText;
            } else {
                d.innerHTML = '<br>';
            }
            frag.appendChild(d);
        });
        e.innerHTML = '';
        e.appendChild(frag);
        
        let lastDiv = e.lastElementChild;
        if(lastDiv){
            let sel = window.getSelection();
            if(sel){
                let range = document.createRange();
                range.selectNodeContents(lastDiv);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }
    } else {
        let sel = window.getSelection();
        if(!sel || sel.rangeCount === 0){
            let lines = text.split('\n');
            let frag = document.createDocumentFragment();
            lines.forEach(lineText => {
                let d = document.createElement('div');
                if(lineText) d.textContent = lineText;
                else d.innerHTML = '<br>';
                frag.appendChild(d);
            });
            e.appendChild(frag);
        } else {
            let range = sel.getRangeAt(0);
            range.deleteContents();
            let lines = text.split('\n');
            if(lines.length === 1){
                let tn = document.createTextNode(lines[0]);
                range.insertNode(tn);
                range.setStartAfter(tn);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
            } else {
                let node = range.startContainer;
                while(node && node.parentElement !== e && node !== e){
                    node = node.parentElement;
                }
                let curDiv = (node && node.parentElement === e) ? node : e.firstElementChild;
                let curText = curDiv ? curDiv.textContent.replace(/[\r\n]/g, '') : '';
                if(!curText){
                    curDiv.textContent = lines[0] || '';
                    if(!lines[0]) curDiv.innerHTML = '<br>';
                    let nextSibling = curDiv.nextSibling;
                    let lastInserted = curDiv;
                    for(let i = 1; i < lines.length; i++){
                        let nd = document.createElement('div');
                        if(lines[i]) nd.textContent = lines[i];
                        else nd.innerHTML = '<br>';
                        e.insertBefore(nd, nextSibling);
                        lastInserted = nd;
                    }
                    let selRange = document.createRange();
                    selRange.selectNodeContents(lastInserted);
                    selRange.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(selRange);
                } else {
                    let preRange = range.cloneRange();
                    preRange.selectNodeContents(curDiv);
                    preRange.setEnd(range.startContainer, range.startOffset);
                    let preText = preRange.toString();
                    
                    let postRange = range.cloneRange();
                    postRange.selectNodeContents(curDiv);
                    postRange.setStart(range.endContainer, range.endOffset);
                    let postText = postRange.toString();
                    
                    curDiv.textContent = preText + lines[0];
                    let nextSibling = curDiv.nextSibling;
                    let lastInserted = curDiv;
                    for(let i = 1; i < lines.length - 1; i++){
                        let nd = document.createElement('div');
                        if(lines[i]) nd.textContent = lines[i];
                        else nd.innerHTML = '<br>';
                        e.insertBefore(nd, nextSibling);
                        lastInserted = nd;
                    }
                    let endDiv = document.createElement('div');
                    let endText = lines[lines.length - 1] + postText;
                    if(endText) endDiv.textContent = endText;
                    else endDiv.innerHTML = '<br>';
                    e.insertBefore(endDiv, nextSibling);
                    lastInserted = endDiv;
                    
                    let selRange = document.createRange();
                    if(endDiv.firstChild && endDiv.firstChild.nodeType === 3){
                        selRange.setStart(endDiv.firstChild, lines[lines.length - 1].length);
                    } else {
                        selRange.selectNodeContents(endDiv);
                        selRange.collapse(false);
                    }
                    sel.removeAllRanges();
                    sel.addRange(selRange);
                }
            }
        }
    }
    
    // 長文貼り付け時：テキストは即座に画面へ表示され、
    // マス入れ・空行調整・文字数カウント・保存などの重い処理は急がず1秒後（1000ms）に実行
    scheduleHeavyTask(1000, true);
    sc();
});

function getToolOrder(){
    let saved=localStorage.getItem('n_tool_order');
    if(saved){
        try{
            let arr=JSON.parse(saved);
            if(Array.isArray(arr)&&arr.length>0){
                let set=new Set(arr);
                let full=[...arr];
                defaultToolOrder.forEach(id=>{
                    if(!set.has(id))full.push(id);
                });
                return full;
            }
        }catch(err){}
    }
    return [...defaultToolOrder];
}

function initToolDragAndDrop(){
    const header=document.querySelector('.h');
    if(!header)return;
    let dragged=null;
    
    header.querySelectorAll('.tool-item').forEach(item=>{
        item.setAttribute('draggable','true');
        
        item.ondragstart=(e)=>{
            dragged=item;
            e.dataTransfer.effectAllowed='move';
            item.classList.add('dragging');
        };
        
        item.ondragend=()=>{
            if(dragged)dragged.classList.remove('dragging');
            header.querySelectorAll('.tool-item').forEach(i=>i.classList.remove('drag-over'));
            dragged=null;
            saveCurrentToolOrderFromDOM();
        };
        
        item.ondragover=(e)=>{
            e.preventDefault();
            if(!dragged||dragged===item)return;
            let rect=item.getBoundingClientRect();
            let midX=rect.left+rect.width/2;
            if(e.clientX<midX){
                header.insertBefore(dragged,item);
            }else{
                header.insertBefore(dragged,item.nextSibling);
            }
        };
    });
}

    });
}

/* マス目やエディタ領域をクリック・タップした時のカーソル配置処理 */
function applyCaretToDiv(targetDiv, targetCol, maxCols){
    if(!targetDiv) return;
    targetCol = Math.min(targetCol, maxCols);
    let lineText = targetDiv.textContent.replace(/\r?\n/g,'');
    let sel = window.getSelection();
    if(!sel) return;
    let range = document.createRange();
    
    if(lineText.length === 0){
        // 空行の場合
        if(targetCol > 0){
            // 指定のマス目（targetCol）まで全角スペースで埋めてカーソルを配置
            let pad = '　'.repeat(targetCol);
            let tn = document.createTextNode(pad);
            targetDiv.innerHTML = '';
            targetDiv.appendChild(tn);
            targetDiv.appendChild(document.createElement('br'));
            range.setStart(tn, targetCol);
            range.collapse(true);
        } else {
            let br = targetDiv.querySelector('br');
            if(!br){
                targetDiv.innerHTML = '<br>';
            }
            range.setStart(targetDiv, 0);
            range.collapse(true);
        }
    } else {
        // すでに文字がある行の場合
        if(targetCol > lineText.length){
            // 行末より右の空きマスをクリック：全角スペースで埋めてそのマス目にカーソル配置
            let padCount = targetCol - lineText.length;
            let pad = '　'.repeat(padCount);
            let tn = document.createTextNode(pad);
            let br = targetDiv.querySelector('br');
            if(br){
                targetDiv.insertBefore(tn, br);
            } else {
                targetDiv.appendChild(tn);
            }
            range.setStart(tn, padCount);
            range.collapse(true);
        } else {
            // 文字の存在するマス目をクリック：その文字の位置へ
            setCaretCharOffset(targetDiv, targetCol);
            return;
        }
    }
    sel.removeAllRanges();
    sel.addRange(range);
}

let lastHandleTime = 0;
let lastTouchPos = null;
let touchMoved = false;
let touchStartScrollTop = 0;
let touchHandled = false;

window.addEventListener('touchstart', (ev)=>{
    if(ev.touches && ev.touches.length === 1){
        let mCont = document.querySelector('.m');
        touchStartScrollTop = mCont ? mCont.scrollTop : 0;
        lastTouchPos = {
            x: ev.touches[0].clientX,
            y: ev.touches[0].clientY,
            time: Date.now()
        };
        touchMoved = false;
        touchHandled = false;
    }
}, {passive:true});

window.addEventListener('touchmove', (ev)=>{
    if(lastTouchPos && ev.touches && ev.touches.length === 1){
        let mCont = document.querySelector('.m');
        let curScroll = mCont ? mCont.scrollTop : 0;
        let scrollDelta = Math.abs(curScroll - touchStartScrollTop);
        let dx = Math.abs(ev.touches[0].clientX - lastTouchPos.x);
        let dy = Math.abs(ev.touches[0].clientY - lastTouchPos.y);
        // 実際にコンテナがスクロールしたか、または大きなドラッグ（25px超）があった場合のみスクロールと判定
        if(scrollDelta > 8 || dx > 25 || dy > 25){
            touchMoved = true;
        }
    }
}, {passive:true});

window.addEventListener('touchend', (ev)=>{
    if(!touchMoved && lastTouchPos && (Date.now() - lastTouchPos.time < 500)){
        let changed = ev.changedTouches && ev.changedTouches[0];
        if(changed){
            let targetEl = document.elementFromPoint(changed.clientX, changed.clientY);
            if(targetEl && (targetEl.closest('#e') || targetEl.closest('#w') || targetEl.closest('.m'))){
                if(!targetEl.closest('#s') && !targetEl.closest('.h') && !targetEl.closest('.modal-overlay') && !targetEl.closest('#repBar') && !targetEl.closest('button') && !targetEl.closest('input') && !targetEl.closest('select')){
                    touchHandled = true;
                    handleCellClick({
                        clientX: changed.clientX,
                        clientY: changed.clientY,
                        target: targetEl
                    });
                }
            }
        }
    }
}, {passive:true});

function handleCellClick(ev){
    if(ev.target && (ev.target.closest('#s')||ev.target.closest('.h')||ev.target.closest('#itemModal')||ev.target.closest('#repBar')||ev.target.closest('.modal-overlay')||ev.target.closest('button')||ev.target.closest('input')||ev.target.closest('select'))) return;
    
    // スクロール中の誤作動防止
    if(touchMoved && (Date.now() - (lastTouchPos?.time || 0) < 350)) return;
    
    let now = Date.now();
    if(now - lastHandleTime < 60) return;
    lastHandleTime = now;
    
    // 座標の取得（タッチまたはクリック）
    let clientX = ev.clientX;
    let clientY = ev.clientY;
    if((clientX === undefined || clientX === 0) && lastTouchPos){
        clientX = lastTouchPos.x;
        clientY = lastTouchPos.y;
    }
    if(clientX === undefined || clientY === undefined) return;
    
    let rect = e.getBoundingClientRect();
    let cs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cs')) || 32;
    let maxCols = parseInt(l.value) || 30;
    let padLeft = cs * 0.11;
    let clickX = clientX - rect.left - padLeft;
    let clickY = clientY - rect.top;
    
    ensureGridLines();
    let divs = e.querySelectorAll('#e>div');
    if(divs.length === 0){
        e.innerHTML = '<div><br></div>';
        divs = e.querySelectorAll('#e>div');
    }
    
    // 1. 本文より上をクリックした場合：1行目の先頭に合わせる
    if(clickY < 0){
        let firstDiv = divs[0];
        if(firstDiv){
            if(document.activeElement !== e) e.focus();
            applyCaretToDiv(firstDiv, 0, maxCols);
        }
        return;
    }
    
    let targetRow = Math.max(0, Math.floor(clickY / cs));
    let targetCol = Math.max(0, Math.floor(clickX / cs));
    targetCol = Math.min(targetCol, maxCols);
    
    // 2. 目的の行が存在しない場合、画面外や本文下部をタップしても大量の空行が暴走生成されないよう安全に処理
    if(targetRow >= divs.length){
        let lastDiv = divs[divs.length - 1];
        let lastText = lastDiv ? lastDiv.textContent.replace(/[\r\n]/g, '') : '';
        if(lastText.length > 0){
            let nd = document.createElement('div');
            nd.innerHTML = '<br>';
            e.appendChild(nd);
            divs = e.querySelectorAll('#e>div');
            targetRow = divs.length - 1;
        }else{
            targetRow = divs.length - 1;
        }
        targetCol = 0;
    }
    
    let targetDiv = divs[targetRow];
    if(targetDiv){
        if(document.activeElement !== e){
            e.focus();
        }
        applyCaretToDiv(targetDiv, targetCol, maxCols);
        v();
        s();
    }
}
e.addEventListener('mousedown',()=>{ if(document.activeElement !== e) e.focus(); });
e.addEventListener('click',(ev)=>{
    if(touchHandled && (Date.now() - (lastTouchPos?.time || 0) < 500)) return;
    let closestDiv = ev.target.closest('#e>div');
    if(closestDiv){
        let lineText = closestDiv.textContent.replace(/[\r\n]/g, '');
        let cs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cs')) || 32;
        let rect = e.getBoundingClientRect();
        let padLeft = cs * 0.11;
        let clickCol = Math.floor((ev.clientX - rect.left - padLeft) / cs);
        if(clickCol < lineText.length && ev.target !== e){
            v();
            return;
        }
    }
    handleCellClick(ev);
});
w.addEventListener('click',(ev)=>{
    if(touchHandled && (Date.now() - (lastTouchPos?.time || 0) < 500)) return;
    if(ev.target===w||ev.target.classList.contains('l')||ev.target===n){
        handleCellClick(ev);
    }
});
const mContainer=document.querySelector('.m');
if(mContainer){
    mContainer.addEventListener('click',(ev)=>{
        if(touchHandled && (Date.now() - (lastTouchPos?.time || 0) < 500)) return;
        if(ev.target===mContainer){
            handleCellClick(ev);
        }
    });
}

if(window.ResizeObserver){
